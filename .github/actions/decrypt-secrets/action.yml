name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'
inputs:
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: install python deps
      shell: bash
      run: |
        pip install pyzipper
    - name: Decrypt and Mask
      shell: python
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
        ZIP_PATH: ${{ inputs.zip_path }}
        ZIP_PASSWORD: ${{ inputs.zip_password }}
        VALIDATION_PATH: ${{ github.action_path }}/../../../rdgenerator
      run: |
        import sys
        import io
        import pyzipper
        import json
        import os

        # Force UTF-8 stdout/stderr so secrets with characters outside
        # the runner codepage (CJK, emoji, etc.) do not crash this step
        # on Windows runners (default cp1251) with UnicodeEncodeError
        sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding="utf-8", errors="replace")
        sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding="utf-8", errors="replace")

        sys.path.insert(0, os.environ['VALIDATION_PATH'])
        from build_inputs import validate_build_inputs
        with pyzipper.AESZipFile(os.environ['ZIP_PATH']) as zf:
            zf.setpassword(os.environ['ZIP_PASSWORD'].encode())
            with zf.open('secrets.json') as f:
                secrets = json.load(f)

        # Validate all inputs before exporting any variable.
        validate_build_inputs(secrets)
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
            for key, value in secrets.items():
                if value:
                    print(f"::add-mask::{value}")
                    env_file.write(f"{key}={value}\n")
        
        print(f"Successfully masked {len(secrets)} secrets.")
