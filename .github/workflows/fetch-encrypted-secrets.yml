name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string
    secrets:
      GENERATOR_URL:
        required: true

permissions:
  contents: read

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted inputs with bounded retry
        shell: python
        env:
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}
          GENERATOR_URL: ${{ secrets.GENERATOR_URL }}
        run: |
          import json
          import os
          import re
          import time
          from urllib.parse import urlsplit
          import requests

          config = json.loads(os.environ["ZIP_URL_JSON"])
          expected = urlsplit(os.environ["GENERATOR_URL"])
          supplied = urlsplit(config.get("url", ""))
          if (expected.scheme != "https" or not expected.hostname or expected.username or
              expected.password or expected.query or expected.fragment):
              raise SystemExit("Generator URL secret must be a plain HTTPS base URL")
          if (supplied.scheme != "https" or supplied.hostname != expected.hostname or
              supplied.port != expected.port or supplied.path.rstrip("/") != expected.path.rstrip("/") or
              supplied.username or supplied.password or supplied.query or supplied.fragment):
              raise SystemExit("Encrypted input URL does not match the configured generator")

          filename = config.get("file", "")
          if not re.fullmatch(r"secrets_[0-9a-fA-F-]{36}\.zip", filename):
              raise SystemExit("Invalid encrypted input filename")

          url = expected.geturl().rstrip("/") + "/get_zip"
          temporary = "secrets.zip.part"
          for attempt in range(3):
              try:
                  response = requests.get(url, params={"filename": filename}, timeout=(5, 30),
                                          allow_redirects=False, stream=True)
                  if response.status_code == 429 or response.status_code >= 500:
                      response.raise_for_status()
                      raise requests.HTTPError(f"Transient HTTP {response.status_code}")
                  if response.is_redirect or response.status_code >= 400:
                      raise SystemExit(f"Generator rejected encrypted input (HTTP {response.status_code})")
                  size = 0
                  with open(temporary, "wb") as output:
                      for chunk in response.iter_content(1024 * 1024):
                          size += len(chunk)
                          if size > 20 * 1024 * 1024:
                              raise SystemExit("Encrypted input exceeds 20 MiB")
                          output.write(chunk)
                  with open(temporary, "rb") as source:
                      if source.read(4) != b"PK\x03\x04":
                          raise SystemExit("Generator response is not a ZIP archive")
                  os.replace(temporary, "secrets.zip")
                  break
              except (requests.Timeout, requests.ConnectionError, requests.HTTPError) as error:
                  if attempt == 2:
                      raise SystemExit(f"Temporary generator download failure after 3 attempts: {type(error).__name__}")
                  time.sleep(2 ** attempt)
              finally:
                  if os.path.exists(temporary):
                      os.remove(temporary)

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1