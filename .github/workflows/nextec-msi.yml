name: Validar MSI Nextec
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/build-msi.ps1'
      - '.github/scripts/test-msi-build.ps1'
      - '.github/scripts/build-setup-exe.ps1'
      - '.github/scripts/test-setup-exe.ps1'
      - '.github/scripts/test-msi-install.ps1'
      - '.github/scripts/install-msi-artwork.ps1'
      - '.github/workflows/*generator-windows.yml'
      - '.github/workflows/generator-linux.yml'
      - '.github/workflows/nextec-msi.yml'
      - 'nextec/atualizacao/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exe-wrapper:
    name: Validar instalador EXE e MSI incorporado
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compilar EXE real e verificar payload sem executar instalação
        shell: pwsh
        run: ./.github/scripts/test-setup-exe.ps1
  package:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        source: ['1.5.0', 'master']
    steps:
      - uses: actions/checkout@v4
      - name: Verificar manifestos de atualizacao com PowerShell Windows
        shell: pwsh
        run: |
          & ./.github/scripts/test-msi-build.ps1
          python nextec/atualizacao/test_manifest.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Signature tests failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File nextec/atualizacao/test_signing_session.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Local signing session failed' }
          python nextec/atualizacao/test_assinar_pedido_connect.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Local signer tests failed' }
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'nextec-update') | Out-Null
          Copy-Item nextec/atualizacao/Instalar-Nextec.ps1 (Join-Path $env:RUNNER_TEMP 'nextec-update/Instalar-Nextec.ps1')
          Copy-Item nextec/atualizacao/Agente-Senha-Nextec.ps1 (Join-Path $env:RUNNER_TEMP 'nextec-update/Agente-Senha-Nextec.ps1')
          Copy-Item nextec/atualizacao/Coordenar-Agente-Nextec.ps1,nextec/atualizacao/Provisionar-Agente-Nextec.ps1 (Join-Path $env:RUNNER_TEMP 'nextec-update')
          $agentHash = (Get-FileHash nextec/atualizacao/Agente-Senha-Nextec.ps1 -Algorithm SHA256).Hash
          $expectedHash = (Select-String -Path nextec/atualizacao/Agente-Senha-Nextec.provenance.txt -Pattern '^vendored file SHA-256: ([a-f0-9]{64})$').Matches.Groups[1].Value
          if (!$expectedHash -or $agentHash -ne $expectedHash) { throw 'Vendored password agent differs from its recorded source hash' }
          "NEXTEC_AGENT_SHA256=$agentHash" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Preparar EXE oficial para testar somente o empacotamento
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force source/rustdesk | Out-Null
          Invoke-WebRequest 'https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.msi' -OutFile official.msi
          $extract = Join-Path $env:RUNNER_TEMP 'official-rustdesk'
          $msi = (Resolve-Path official.msi).Path
          $log = Join-Path $env:RUNNER_TEMP 'extract-msi.log'
          $process = Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$extract`" /l*v `"$log`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 35; throw "Official MSI extraction failed: $($process.ExitCode)" }
          $exe = Get-ChildItem $extract -Filter rustdesk.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Official client EXE missing' }
          Copy-Item "$($exe.Directory.FullName)/*" source/rustdesk -Recurse -Force
          # O nome do app do fixture e "RustDesk" de proposito: o binario oficial tem o nome compilado, e o --password do agente
          # (ipc::set_permanent_password) so funciona quando o app instalado e o do proprio binario (is_installed() procura
          # Uninstall\<nome> e <pasta>\<nome>.exe). Com outro nome o RustDesk responde "Installation and administrative
          # privileges required!" e a troca de senha nao pode ser provada. Nome livre e coberto por test-msi-build.ps1.
          Rename-Item source/rustdesk/rustdesk.exe RustDesk.exe
          python -m pip install Pillow
      - name: Construir MSI com o mesmo script do gerador
        shell: pwsh
        env:
          VERSION: master
          # chave de TESTE (nao e segredo): prova que o inscricao.json entra no pacote
          enroll_key: nx1.1790000000.TesteSomenteCiAbCdEf0123456789
          enroll_panel: https://painel-remoto.nex.tec.br
        run: |
          & ./.github/scripts/build-msi.ps1 -AppName RustDesk -PackageVersion 2.0.7 -SourceRoot "$PWD/source" -UpdaterSource (Join-Path $env:RUNNER_TEMP 'nextec-update')
          $file = 'source/SignOutput/rustdesk.msi'
          $signature = [BitConverter]::ToString([IO.File]::ReadAllBytes((Resolve-Path $file))[0..7])
          if ($signature -ne 'D0-CF-11-E0-A1-B1-1A-E1') { throw 'Invalid MSI file signature' }
          $extract = Join-Path $env:RUNNER_TEMP 'nextec-updater-msi-check'
          $log = Join-Path $env:RUNNER_TEMP 'nextec-updater-msi-check.log'
          $p = Start-Process msiexec.exe -ArgumentList "/a `"$(Resolve-Path $file)`" /qn TARGETDIR=`"$extract`" /l*v `"$log`"" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 30; throw "MSI extraction failed: $($p.ExitCode)" }
          if (!(Get-ChildItem $extract -Filter 'Instalar-Nextec.ps1' -Recurse)) { throw 'Updater script is missing from MSI payload' }
          $agent = Get-ChildItem $extract -Filter 'Agente-Senha-Nextec.ps1' -Recurse | Select-Object -First 1
          if (!$agent) { throw 'Password agent is missing from MSI payload' }
          if ((Get-FileHash $agent.FullName -Algorithm SHA256).Hash -ne $env:NEXTEC_AGENT_SHA256) { throw 'Password agent payload differs from reviewed source' }
          $marker = Get-ChildItem $extract -Filter 'nextec-marker.json' -Recurse | Select-Object -First 1
          if (!$marker) { throw 'Installation marker is missing from MSI payload' }
          if ((Get-Content $marker.FullName -Raw | ConvertFrom-Json).app -ne 'RustDesk') { throw 'Installation marker has the wrong app name' }
          $enrollment = Get-ChildItem $extract -Filter 'inscricao.json' -Recurse | Select-Object -First 1
          if (!$enrollment) { throw 'Enrollment file is missing from MSI payload' }
          $data = Get-Content $enrollment.FullName -Raw | ConvertFrom-Json
          if ($data.v -ne 1 -or $data.painel -ne $env:enroll_panel -or $data.chave -ne $env:enroll_key) { throw 'Enrollment payload differs from build input' }
      - name: Verificar EXE wrapper com o MSI e agente reais
        shell: pwsh
        run: |
          $msi = (Resolve-Path source/SignOutput/rustdesk.msi).Path
          $portable = (Resolve-Path source/rustdesk/RustDesk.exe).Path
          & ./.github/scripts/test-setup-exe.ps1 -MsiPath $msi -PortablePath $portable
          if ($LASTEXITCODE -ne 0) { throw 'EXE wrapper did not preserve the tested MSI and agent payload' }
      - name: Instalar e reparar de verdade no Windows Server 2022 isolado
        shell: pwsh
        run: ./.github/scripts/test-msi-install.ps1 -MsiPath source/SignOutput/rustdesk.msi -AgentSha256 $env:NEXTEC_AGENT_SHA256 -EnrollmentKey nx1.1790000000.TesteSomenteCiAbCdEf0123456789 -EnrollmentPanel https://painel-remoto.nex.tec.br
      - name: Guardar logs de instalação para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalacao-windows-${{ matrix.source }}
          path: ${{ runner.temp }}/nextec-real-*.log
          if-no-files-found: ignore
          retention-days: 7

  deb-package:
    name: Validar pacote Debian e atualizador Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir .deb de teste e validar integração do atualizador
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/nextec-deb-fixture"
          mkdir -p "$work/DEBIAN" "$work/usr/bin"
          cat > "$work/DEBIAN/control" <<'EOF'
          Package: nextec-connect
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Nextec <ti@nex.tec.br>
          Description: Fixture para validar o pacote do Nextec Connect
          Depends: libc6
          EOF
          printf '#!/bin/sh\nexit 0\n' > "$work/usr/bin/nextec-connect"
          chmod 0755 "$work/usr/bin/nextec-connect"
          dpkg-deb --build --root-owner-group "$work" "$RUNNER_TEMP/nextec-connect-test.deb"
          bash -n nextec/atualizacao/empacotar-deb-atualizador.sh
          bash nextec/atualizacao/empacotar-deb-atualizador.sh "$RUNNER_TEMP/nextec-connect-test.deb" nextec/atualizacao Nextec-Connect
          python3 nextec/atualizacao/test_agente_senha_linux.py -v
          python3 nextec/atualizacao/test_coordenador_agente_linux.py -v
          python3 nextec/atualizacao/test_assinar_pedido_connect.py -v
          python3 nextec/atualizacao/test_painel_configuravel_linux.py -v
          test "$(dpkg-deb -f "$RUNNER_TEMP/nextec-connect-test.deb" Package)" = "nextec-connect"
          dpkg-deb -f "$RUNNER_TEMP/nextec-connect-test.deb" Depends | grep -q python3
          extracted="$RUNNER_TEMP/nextec-deb-extracted"
          mkdir -p "$extracted"
          dpkg-deb -R "$RUNNER_TEMP/nextec-connect-test.deb" "$extracted"
          test -x "$extracted/usr/lib/nextec-connect/atualizador-linux.py"
          test -x "$extracted/usr/lib/nextec-connect/agente-senha-linux.py"
          # inscricao global: gerar (com e sem chave), incorporar, modo 0600 e sem a chave na saida
          bash -n nextec/atualizacao/inscricao-linux.sh
          key='nx1.1790000000.TesteSomenteCiAbCdEf0123456789'
          out=$(enroll_key= enroll_panel= bash nextec/atualizacao/inscricao-linux.sh gerar "$RUNNER_TEMP/sem.json")
          echo "$out" | grep -q 'SEM inscricao.json'
          test ! -e "$RUNNER_TEMP/sem.json"
          out=$(enroll_key="$key" enroll_panel=https://painel-remoto.nex.tec.br bash nextec/atualizacao/inscricao-linux.sh gerar "$RUNNER_TEMP/inscricao.json")
          ! echo "$out" | grep -qF "$key"
          out=$(bash nextec/atualizacao/inscricao-linux.sh incorporar "$RUNNER_TEMP/nextec-connect-test.deb" "$RUNNER_TEMP/inscricao.json")
          ! echo "$out" | grep -qF "$key"
          after="$RUNNER_TEMP/nextec-deb-enroll"
          mkdir -p "$after"
          dpkg-deb -R "$RUNNER_TEMP/nextec-connect-test.deb" "$after"
          test ! -e "$after/etc/nextec/inscricao.json"
          # fonte lida pelo coordenador: ao lado dele, root:root 0600
          test "$(stat -c %a "$after/usr/lib/nextec-connect/inscricao.json")" = 600
          dpkg-deb --contents "$RUNNER_TEMP/nextec-connect-test.deb" | grep "usr/lib/nextec-connect/inscricao.json" | grep -q "^-rw------- root/root"
          NEXTEC_TEST_DEB="$RUNNER_TEMP/nextec-connect-test.deb" NEXTEC_TEST_KEY="$key" python3 nextec/atualizacao/test_inscricao_deb_linux.py -v
          python3 nextec/atualizacao/test_inscricao_global_linux.py -v
          grep -qF "$key" "$after/usr/lib/nextec-connect/inscricao.json"
          grep -qF '"painel":"https://painel-remoto.nex.tec.br"' "$after/usr/lib/nextec-connect/inscricao.json"
          test -x "$after/usr/lib/nextec-connect/atualizador-linux.py"
          cmp "$extracted/usr/lib/nextec-connect/agente-senha-linux.py" "$after/usr/lib/nextec-connect/agente-senha-linux.py"
          cmp "$extracted/usr/lib/nextec-connect/coordenador-agente-nextec-linux.py" "$after/usr/lib/nextec-connect/coordenador-agente-nextec-linux.py"
          test -x "$extracted/usr/lib/nextec-connect/coordenador-agente-nextec-linux.py"
          test -f "$extracted/usr/lib/systemd/system/nextec-agent-bootstrap.service"
          test -f "$extracted/usr/lib/systemd/system/nextec-agent-bootstrap.timer"
          grep -q 'enable --now nextec-agent-bootstrap.timer' "$extracted/DEBIAN/postinst"
          grep -q 'disable --now nextec-agent-bootstrap.timer nextec-agent-bootstrap.service' "$extracted/DEBIAN/prerm"
          cmp nextec/atualizacao/agente-senha-linux.py "$extracted/usr/lib/nextec-connect/agente-senha-linux.py"
          test -f "$extracted/usr/lib/systemd/system/nextec-connect-update.service"
          test -f "$extracted/usr/lib/systemd/system/nextec-connect-update.timer"
          test -f "$extracted/usr/lib/systemd/system/nextec-connect-agent.service"
          test -f "$extracted/usr/lib/systemd/system/nextec-connect-agent.timer"
          grep -q 'enable --now nextec-connect-update.timer' "$extracted/DEBIAN/postinst"
          grep -q 'disable --now nextec-connect-update.timer' "$extracted/DEBIAN/prerm"
          grep -q 'enable nextec-connect-agent.timer' "$extracted/DEBIAN/postinst"
          grep -q 'disable --now nextec-connect-agent.timer nextec-connect-agent.service' "$extracted/DEBIAN/prerm"
          grep -q 'ConditionPathExists=/var/lib/nextec-connect/agent-config.json' "$extracted/usr/lib/systemd/system/nextec-connect-agent.service"
          grep -q 'ConditionPathExists=/var/lib/nextec-connect/agent-config.json' "$extracted/usr/lib/systemd/system/nextec-connect-agent.timer"
          ! grep -E 'rm .*(/var/lib/nextec-connect|agent-config.json)' "$extracted/DEBIAN/prerm"
          test ! -e "$extracted/var/lib/nextec-connect/agent-config.json"
          python3 -m py_compile "$extracted/usr/lib/nextec-connect/atualizador-linux.py"
          python3 -m py_compile "$extracted/usr/lib/nextec-connect/agente-senha-linux.py"
          # nome livre: marcador de instalacao independente do nome e sem dominio fixo nos scripts
          test "$(cat "$extracted/usr/lib/nextec-connect/nextec-marker.json")" = '{"v":1,"app":"Nextec-Connect","upgrade_code":"nextec-connect"}'
          ! grep -rq 'nex\.tec\.br' "$extracted/usr/lib/nextec-connect"/*.py
          sed -i 's/^Package: .*/Package: xpto/' "$work/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$work" "$RUNNER_TEMP/xpto.deb"
          bash nextec/atualizacao/empacotar-deb-atualizador.sh "$RUNNER_TEMP/xpto.deb" nextec/atualizacao XPTO
          xpto="$RUNNER_TEMP/xpto-extracted"; mkdir -p "$xpto"; dpkg-deb -R "$RUNNER_TEMP/xpto.deb" "$xpto"
          test "$(cat "$xpto/usr/lib/nextec-connect/nextec-marker.json")" = '{"v":1,"app":"XPTO","upgrade_code":"xpto"}'
