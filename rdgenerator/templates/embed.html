<style>
  html[data-embedded] body { height:auto; min-height:0; }
  html.dark { color-scheme:dark; --nx-bg:#131315; --nx-surface:#1c1c20; --nx-field:#27272b; --nx-border:#414148; --nx-divider:#35353b; --nx-ink:#e8e8ee; --nx-muted:#c8c5ce; --nx-navy:#e8e8ee; --nx-tint:#393044; }
  html.dark body { background:var(--nx-bg); color:var(--nx-ink); }
  html.dark :is(.section,.error-container) { background:var(--nx-surface); }
</style>
<script>
(() => {
  if (parent === window) return;
  document.documentElement.dataset.embedded = 'true';
  {% if uuid %}
  parent.postMessage({type:'nextec-generation-started', uuid:'{{ uuid|escapejs }}'}, location.origin);
  {% endif %}
  const report = () => parent.postMessage({type:'nextec-generator-ready', height:Math.ceil(document.body.scrollHeight)}, location.origin);
  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== parent || event.data?.type !== 'nextec-generator-theme') return;
    const dark = event.data.dark === true;
    if (document.documentElement.classList.contains('dark') !== dark) {
      document.documentElement.classList.toggle('dark', dark);
      report();
    }
  });
  new ResizeObserver(report).observe(document.body);
  window.addEventListener('load', report);
  report();
})();
</script>
